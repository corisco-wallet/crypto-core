name: Audit (scheduled)

# New advisories appear without any code change, so re-check weekly.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# rustsec/audit-check reports results as a check run.
permissions:
  contents: read
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
