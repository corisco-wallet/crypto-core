name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The firmware enables seed-lock + transfer-crypto together, but each
      # must also build alone so feature gating doesn't silently couple them.
      # Not --all-features: `hw-sha512` depends on esp-idf-sys, which only
      # builds against the ESP-IDF/Xtensa target, not this host runner.
      matrix:
        features: ["", "seed-lock", "transfer-crypto", "seed-lock,transfer-crypto"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --features "${{ matrix.features }}" --all-targets -- -D warnings
      - name: test
        run: cargo test --features "${{ matrix.features }}"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.lock isn't committed (library crate), so resolve one first.
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
